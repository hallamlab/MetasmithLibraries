ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: v1
types:
  accession_list:
    properties:
      database: NCBI
      arity: N
      ext: csv
  accession:
    properties:
      Data: NCBI accession
      arity: 1
      ext: txt
  assembly_accession:
    extends: accession
    properties:
      database: assemblies
  sra_accession:
    extends: accession
    properties:
      database: SRA
  sra_cache:
    properties:
      _: sra prefetch cache
