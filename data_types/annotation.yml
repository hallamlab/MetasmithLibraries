types:
  # InterProScan
  interproscan_results:
    properties:
      _: Parsed InterProScan protein matches
      Format: CSV
      ext: csv

  # KofamScan
  kofamscan_results:
    properties:
      _: Filtered KofamScan KO assignments
      Format: CSV
      ext: csv

  # ProteinBERT
  proteinbert_embeddings:
    properties:
      _: ProteinBERT embedding vectors
      Format: Parquet
      ext: parquet
  proteinbert_index:
    properties:
      _: ProteinBERT sequence index
      Format: CSV
      ext: csv

  # DeepEC
  deepec_predictions:
    properties:
      _: DeepEC EC number predictions
      ext: tsv

  # DIAMOND UniRef50
  diamond_uniref50_results:
    properties:
      _: DIAMOND alignment to UniRef50
      Format: BLAST6
      ext: tsv
